services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sunrise_dental
      MYSQL_USER: sunrise
      MYSQL_PASSWORD: sunrise123
      MYSQL_ROOT_PASSWORD: root123
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sunrise_dental?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: sunrise
      DB_PASSWORD: sunrise123
      JWT_SECRET: local-docker-secret-change-before-production-123456789
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  mysql_data:
