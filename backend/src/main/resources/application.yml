server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sunrise_dental?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo}
    username: ${DB_USERNAME:sunrise}
    password: ${DB_PASSWORD:sunrise123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Colombo
app:
  jwt:
    secret: ${JWT_SECRET:replace-this-development-secret-with-at-least-32-characters}
    expiration-hours: 8
springdoc:
  swagger-ui:
    path: /swagger-ui.html
